[tab MANUAL]
art file=skin/looks/_bg_print.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALBLEED: GHOST BLEED" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:0
text cx=60 cy=280 label="Listens for each hit and adds quiet, synthetic residue behind it: snare wires buzzing, a cabinet booming, a" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=312 label="piano board ringing. Your chops sound like they came off a real recording, with other instruments leaking in." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=360 label="Add it as an insert effect on a chopped loop, a drum bus, a track or a pad. It is not in the instrument list." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=392 label="Quick start: turn LISTEN on. Lower SENSE until the important hits ring, then raise BLEED until you hear it" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=84 cy=424 label="clearly." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=456 label="Turn LISTEN off and bring BLEED back down until the residue sits behind the track." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=488 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=488 label="Nothing is delayed, so your MPC's timing stays exactly where it was." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=536 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=280 label="SOURCE: what leaks in (next page). BLEED: how much. Small amounts usually sound most real." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=312 label="SENSE: how hard a hit has to be, -60 to -6 dB." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=344 label="CHANCE: how often a hit leaks. 100 % is every hit, lower values give the odd ghost." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=376 label="DECAY: how long the residue rings, 30 ms to 1.5 s." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=408 label="DUCK keeps it down under loud audio. GAPS brings it up in the quiet spaces." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=440 label="TONE: dark to bright. TICK: adds a needle tick on each hit." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=472 label="DRIFT: a slow wobble, slightly different left and right, on the whole sound." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=504 label="LISTEN: hear just the residue, to set it up. Turn it off again for the mix." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=536 label="ROLL: picks a new source and shape. MILD, MEDIUM or WILD sets how far it goes." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=60 cy=240 label="SOURCES AND PRESETS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:2
text cx=60 cy=280 label="All eight sources are generated in the plugin (tuned resonances and filtered noise), not recordings." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=328 label="WIRES: snare wires rattling behind the kick. CABINET: a bass cabinet's low thump and boom." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=360 label="SOUNDBOARD: a piano's wooden board ringing. TINES: bright struck tines, electric-piano style." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=392 label="STRINGS: string scrape and ring. CYMBAL: a soft metallic wash." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=424 label="ROOM: a small room's low ring and air. BARS: vibraphone-like bars." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=472 label="MPC's PRESET menu: Wires behind the kit, Bass in the room, Piano lid open, Rhodes shimmer, Guitar scrape, Cymbal" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=504 label="wash, Small room, Vibes and Old record, then the four chain presets." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=240 label="FX CHAINS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:3
text cx=60 cy=280 label="Put the plugins on a track's inserts in the order shown, then pick the same preset name in each one." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=328 label="DUSTY LOOP (soul, jazz and library loops): BLEED > Patina > Grit. Bleed is on SOUNDBOARD." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=360 label="90s STAB (chopped horns, keys and vocal stabs): Grit > Punch > BLEED > Patina. Bleed is on TINES." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=392 label="BREAK BUS (a boom-bap drum bus): Punch > Grit > BLEED > Patina. Bleed is on WIRES." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=424 label="DUB DRUMS (lo-fi dub drums): Patina > Punch > BLEED > Grit. Bleed is on ROOM." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=472 label="Here, in Patina and in Grit the name is in the MPC's PRESET menu. In Punch it is on the PRESETS buttons." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=520 label="Rules of thumb: Punch early, Bleed before Patina so the bleed is aged with the sound, echo and chop last, one" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=552 label="noise source per chain, and match levels with OUTPUT before you decide." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=240 label="USER PRESETS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=280 label="To save: open the USER page, tap SAVE, then tap a slot. The slot now reads USER and its number." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=312 label="To load: tap a slot. The slot you loaded last is lit." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=344 label="Saving to a slot that is already filled replaces it straight away." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=376 label="The 8 slots are kept on the drive the plugin is on, in a folder called PotentialSuite Presets. Every project" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=408 label="and every copy of the plugin sees them, and updating the plugin keeps them." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=440 label="A slot keeps the knobs and the source. It does not keep LISTEN, the ROLL setting or the look." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=472 label="A chain of your own: save each plugin's part to the same slot number, for example USER 3 in Punch, Grit and" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=504 label="Bleed. Later, tap USER 3 in each." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=280 label="Q-Links: BLEED, SOURCE, DECAY, SENSE, CHANCE, DUCK, GAPS and TONE, then TICK, DRIFT, OUTPUT and LISTEN." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=312 label="Every setting is saved with your project." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=344 label="Looks: Print Plate, Night Rack, Colour Block or Vintage, on the SETTINGS page. A new look shows the next time" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=84 cy=376 label="the plugin loads." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=408 label="There is no lookahead and nothing is delayed." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=440 label="If nothing rings, lower SENSE. If everything rings, raise it." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=472 label="Stereo in, stereo out, at 44.1 kHz." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialbleed" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
